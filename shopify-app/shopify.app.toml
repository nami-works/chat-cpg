# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "nami-seo-lab"
client_id = "your-client-id"
application_url = "https://your-app-url.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_products,write_blogs,read_blogs,write_blog_articles,read_blog_articles,read_customers,read_orders,read_analytics,read_themes,write_themes"

[auth]
redirect_urls = [
  "https://your-app-url.com/auth/callback",
  "https://your-app-url.com/auth/shopify/callback",
  "https://your-app-url.com/api/auth/callback"
]

[webhooks]
api_version = "2023-10"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "your-dev-store.myshopify.com"
include_config_on_deploy = true
