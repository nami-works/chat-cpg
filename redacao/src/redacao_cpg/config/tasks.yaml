definir_estrategia:
  description: >
    Acesse o site da {marca} e se atualize sobre ela. Leia suas páginas institucionais e de produto.
    Entenda também a fundo seu portfólio de {produtos} e seu {estilo} de comunicação.
    Identifique e sintetize sua proposta de valor, tom de voz, público-alvo e objetivos. Interprete como
    a marca quer ser percebida e quais mensagens ela deseja transmitir. Esse alinhamento será usado
    como guia central do projeto de conteúdo.
  expected_output: >
    Documento estratégico com: identidade verbal, proposta de valor, vocabulário central, público-alvo,
    missão de marca, tom e estilo. Também deve indicar quais categorias de produtos reforçam esses
    atributos de marca.
    Formatado como markdown sem '```'
  agent: estrategista_marca

identificar_produtos:
  description: >
    Com base no site da {marca} no entendimento profundo do seu portfólio de {produtos},
    identifique quais produtos podem ser citados no blog post como possíveis soluções para 
    o problema levantado pelo tema "{tema}" ou como produtos relacionados ao assunto trazido pelo
    tema "{tema}" como um todo.
  expected_output: >
    Relação de entre 3 e 5 {produtos} da marca, que se relacionem de forma clara e direta
    ao tema "{tema}" proposto, e que possam ser citados no blog post de forma a gerar desejo de consumo
    em quem estiver lendo.
    Formatado como markdown sem '```'
  agent: estrategista_marca

mapear_oportunidades:
  description: >
    Pesquise sobre os {produtos} da marca, em especial os produtos definidos na etapa anterior, e com base
    na estratégia definida pelo estrategista, identifique termos de busca, dúvidas comuns, tendências
    de comportamento e oportunidades de conteúdo com potencial de SEO para relacionar o tema "{tema}" aos produtos.
    Categorize por intenção (informacional, comercial, comparativa) e conecte com os produtos.
  expected_output: >
    Tabela com: palavra-chave, intenção de busca, tipo de conteúdo recomendado, produto associado e
    oportunidade estratégica de ranqueamento.
    Formatado como markdown sem '```'
  agent: especialista_seo

planejar_conteudos:
  description: >
    Crie algumas propostas de blog posts baseadas nas oportunidades SEO identificadas. Cada estrutura
    deve ser útil, bem segmentada, com abordagem alinhada ao posicionamento da marca.
  expected_output: >
    Estrutura para entre 1 e 3 conteúdos: título, subtópicos, intenção e tipo de usuário. Relacione cada
    conteúdo a todos os produtos relacionados, e como eles se conectam com cada um dos tópicos dos temas.
    Formatado como markdown sem '```'
  agent: estrategista_conteudo

escrever_conteudo:
  description: >
    Avalie o {blog} da marca e escolha uma das estruturas aprovadas, com base nos seguintes critérios:
    - poder de convencimento para compra
    - atratividade do conteúdo e potencial de geração de engajamento
    - diversificação com relação a conteúdos existentes
    A partir da estrutura escolhida, desenvolva o conteúdo completo. Use linguagem acessível e narrativa envolvente.
    Inclua os produtos relacionados de forma natural, trazendo também os links para cada um, fornecidos no guia de {produtos},
    vinculando seus principais ingredientes, finalidades e atributos aos temas tratados em cada conteúdo, e use parte do texto
    para explicar como eles funcionam na solução da dor que está sendo discutida.
    Os conteúdos devem **INVARIAVELMENTE* ter o foco mantido no tema {tema} definido. **JAMAIS** deve-se disperar para tópicos secundários ou produtos com correlação secundária.
    Otimize o texto com as melhores práticas de SEO. Use também os {campos_semanticos} gerados automaticamente a partir do tema principal.
    **Utilize apenas os campos correspondentes ao tema atual em desenvolvimento.** Distribua naturalmente ao longo do conteúdo,
    preferencialmente nos subtítulos e trechos introdutórios de seções. Priorize termos que ampliem o escopo da busca e tragam
    novas associações de dor ou benefício. Garanta a proporção de campos semânticos recomendada pelas melhores práticas de SEO,
    ao mesmo tempo equilibrando com poder de síntese. Evite se alongar em temas ou tópicos que não precisam.
  expected_output: >
    Texto seguindo as {recomendacoes_formato} com 1000 a 1500 palavras, subtítulos, parágrafos coesos, CTAs e menções a produtos reais,
    com links reais e contexto, incluindo campos semânticos usados de forma estratégica.
    em .
  agent: redator_seo

refinar_narrativa:
  description: >
    Refine o texto fazendo uma leitura crítica e reestruturando quando necessário, cortando repetições e
    reforçando a fluidez entre seções. Adapte o texto de acordo com o {estilo} de escrita.
    Usando os conteúdos das marcas {benchmarks} como referência, otimize o texto para resultados.
    Garanta que não haja numeração de tópicos e subtópicos, de forma que haja fluidez no texto,
    ao mesmo tempo em que seja mantida uma lógica sequencial perceptível.
    ⚠️ Os {campos_semanticos} do tema atual **não devem ser alterados ou removidos** nesta etapa. Eles foram otimizados para SEO
    e devem ser preservados conforme definidos anteriormente.
    Em hipótese devem ser inseridos ou mantidos no texto subtítulos genéricos apenas para demarcar seções como 'Introdução',
    'Desenvolvimento' e 'Conclusão'. Subtítulos devem ser utilizados para dar destaque a seções relevantes.
  expected_output: >
    Versão intermediária com melhorias de ritmo, organização e leitura escaneável. Texto fluido e convincente,
    com poder para quebrar objeções de compra dos usuários.
    O conteúdo deve ser mantido no formato estabelecido em {recomendacoes_formato}.
  agent: editor_coesao

revisar_tudo:
  description: >
    Revise o texto criado na etapa anterior e corrija erros de ortografia, gramática, pontuação, concordância
    e ajuste o estilo quando necessário, tomando por base o {estilo} da marca.
    Busque por informações que sejam fidedignas ao guia de {produtos} e as substitua. Quando não for possível substituí-las,
    remova-as e ajuste o texto para manter a coesão.
    Sempre que uma menção for feita a um produto, certifique-se de que o nome está de acordo com o nome oficial descrito no guia de {produtos}.
    ⚠️ Os {campos_semanticos} do tema atual devem ser preservados **integralmente**. Não devem ser editados, removidos ou modificados
    nesta etapa, pois foram definidos com base em critérios específicos de SEO.
  expected_output: >
    Texto final limpo, claro, uniforme e fiel às bases de conhecimento, pronto para publicação sem necessidade de nova revisão.
    O conteúdo deve ser entregue no formato estabelecido em {recomendacoes_formato}.
  agent: revisor_geral

sugerir_elementos:
  description: >
    Leia o conteúdo gerado na etapa anterior e identifique onde recursos visuais (como gráficos,
    imagens de produtos, comparações ou vídeos explicativos) poderiam facilitar a compreensão,
    dar ritmo à leitura ou reforçar a argumentação.
  expected_output: >
    Texto final (output da task anterior, sem os outputs das outras tasks) acrescido de  sugestões visuais
    contextualizadas, informando tipo (imagem, gráfico, vídeo), ponto de inserção e objetivo da visualização.
    Formatado como markdown sem '```'
  agent: consultor_visual

gerar_metacampos_seo:
  description: >
    A partir do conteúdo final do blog post, do contexto estratégico da marca e dos {campos_semanticos} identificados para o tema,
    defina dois metacampos de SEO. O título deve conter entre 55 e 70 caracteres, ser atrativo, descritivo e conter uma palavra-chave central.
    A metadescrição deve conter entre 140 e 160 caracteres, antecipar o valor do conteúdo e incentivar o clique com clareza.
  expected_output: >
    Arquivo metacampos.md formatado como markdown sem '```', contendo:
    - meta_title: título com 45 a 60 caracteres, alinhado com a proposta da marca e otimizado para CTR.
    O título deve ser extremamente coeso com o texto desenvolvido, conter no máximo entre 5 e 6 palavras, e nele deve ser evitado
    o uso do nome da {marca}, exceto quando for extremamente necessário ou quando gerar valor claro. No título e no texto, devem ser usadas
    letras maiúsculas apenas na primeira palavra de cada sentença, exceto quando usados para falar o nome da marca ou de seus produtos.
    - meta_description: resumo objetivo e atrativo com 140 a 160 caracteres, que resuma o benefício da leitura do post.
    - produtos_relaciondos: produtos prioritários relacionados com o blog post
  agent: especialista_seo

