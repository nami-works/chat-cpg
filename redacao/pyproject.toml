[project]
name = "redacao"
version = "0.1.0"
description = "redacao using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.114.0,<1.0.0"
]

[project.scripts]
redacao = "redacao.main:run"
run_crew = "redacao.main:run"
train = "redacao.main:train"
replay = "redacao.main:replay"
test = "redacao.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
