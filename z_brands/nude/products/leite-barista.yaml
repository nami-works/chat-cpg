    O Nude Leite de Aveia Barista 1L é uma bebida vegetal criada especialmente para uso em cafeterias
    e receitas que pedem espuma cremosa. Clean label, sem lactose e sem glúten, é ideal para cappuccinos,
    lattes, cafés gelados e preparos culinários. Produzido com aveia upcycled, mantém o compromisso
    da Nude com sustentabilidade e saudabilidade.
