    O Creme de Aveia Nude 200g é um produto clean label, feito a partir de aveia upcycled, sem lactose e sem glúten.
    É 100% plant-based e versátil para uso culinário, podendo substituir cremes tradicionais em molhos, sopas,
    sobremesas e preparos diversos. Não contém aditivos artificiais e mantém a textura cremosa da aveia.
