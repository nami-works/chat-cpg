product_description:
  short: "Fios mais fortes, couro cabeludo saudável e menos queda."
  detailed: |
    O Booster Fortificante GE Beauty é um concentrado poderoso que nutre profundamente, controla a oleosidade do couro cabeludo e combate a quebra dos fios. Especialmente formulado para fortalecer a estrutura capilar, este booster oferece nutrição intensiva que resulta em cabelos mais resistentes, saudáveis e cheios de vida. Ideal para cabelos fracos, quebradiços, oleosos na raiz ou com tendência à queda, proporciona equilíbrio ao couro cabeludo enquanto fortalece os fios desde a raiz até as pontas.
  key_differentiators:
    - "Concentrado fortificante para máxima eficácia."
    - "Controla oleosidade do couro cabeludo enquanto nutre os fios."
    - "Combate quebra e fortalece a estrutura capilar."
  positioning: "Para cabelos mais fortes, resistentes e com couro cabeludo equilibrado."
  target_customer: "Pessoas com cabelos fracos, quebradiços, oleosos na raiz ou com tendência à queda."

