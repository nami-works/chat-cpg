product_description:
  short: "Fios alinhados, protegidos e livres de frizz com o Booster Antifrizz."
  detailed: |
    O Booster Antifrizz GE Beauty é um concentrado inteligente que controla o volume, protege do calor e mantém o cabelo macio e brilhante. Formulado com óleo de coco, chia e trehalose, ele realinha as fibras, reduz o volume e controla o frizz, oferecendo proteção térmica e brilho natural. Ideal para quem busca reduzir frizz e volume sem perder o movimento, mesmo em dias úmidos ou com uso frequente de secador e chapinha.
  key_differentiators:
    - "Combina óleo de coco, chia e trehalose para proteção e alinhamento."
    - "Oferece proteção térmica e controle de frizz em ambientes úmidos."
    - "Alternativa segura e biodegradável aos silicones e alisantes convencionais."
  positioning: "Para cabelos alinhados e protegidos, sem frizz e com brilho natural."
  target_customer: "Pessoas que buscam controle de frizz, redução de volume e proteção térmica."

