  short: "Limpeza instantânea, controle da oleosidade e volume imediato com fragrância incrível." # web: https://gebeauty.com.br/products/shampoo-a-seco-ge-beauty-150ml
  detailed: |
    O Shampoo a Seco GE Beauty oferece uma limpeza instantânea, controlando a oleosidade e devolvendo volume sem deixar resíduos pesados. Sua fórmula vegana refresca e cuida do couro cabeludo, sendo ideal para prolongar o tempo entre lavagens sem abrir mão do frescor. Com ingredientes como H-Vit Plus e pantenol, proporciona fios soltos, leves e com aspecto saudável. # web: https://gebeauty.com.br/products/shampoo-a-seco-ge-beauty-150ml
  key_differentiators:
    - Fórmula vegana e não testada em animais
    - Controle da oleosidade sem resíduos visíveis
    - Adequado para todos os tipos de cabelo
  positioning: "Para quem busca prolongar o tempo entre lavagens com frescor e volume." # web: https://gebeauty.com.br/products/shampoo-a-seco-ge-beauty-150ml
  target_customer: "Indivíduos com rotina corrida que desejam manter o cabelo limpo e volumoso entre lavagens." # web: https://gebeauty.com.br/products/shampoo-a-seco-ge-beauty-150ml

