product_description:
  short: "Prolonga o efeito da escova, controla o volume e blinda o cabelo da umidade por até 24h."
  detailed: |
    O Primer Liso Intacto GE Beauty é formulado para prolongar o efeito da escova, controlar o volume e proteger o cabelo da umidade por até 24 horas. Com ingredientes como óleo de girassol, crambe e abacate, ele garante fios alinhados, macios e com brilho, sem rigidez ou peso. Oferece proteção térmica até 230°C e é ideal para quem deseja manter o cabelo liso e sem frizz por mais tempo.
  key_differentiators:
    - "Proteção térmica até 230°C"
    - "Blindagem contra umidade por 24h"
    - "Ingredientes naturais e biodegradáveis"
  positioning: "Para quem deseja prolongar o efeito da escova e manter o cabelo sem frizz."
  target_customer: "Consumidores que buscam prolongar o efeito liso e proteger o cabelo da umidade."

