product_description:
  short: "Limpeza profunda que mantém a leveza e o equilíbrio do couro cabeludo."
  detailed: |
    O Shampoo Sem Sulfato GE Beauty oferece limpeza profunda sem ressecar, mantendo o equilíbrio natural do couro cabeludo. Sua fórmula livre de sulfatos purifica delicadamente, deixando os fios soltos, leves e com brilho natural. Ideal para uso diário, proporciona limpeza eficaz sem agredir o cabelo ou couro cabeludo, sendo adequado para todos os tipos de cabelo, incluindo cabelos coloridos, cacheados, crespos e quimicamente tratados.
  key_differentiators:
    - "Fórmula 100% livre de sulfatos para limpeza suave."
    - "Mantém o equilíbrio natural do couro cabeludo."
    - "Adequado para todos os tipos de cabelo, inclusive coloridos e tratados."
  positioning: "Para cabelos limpos, leves e equilibrados sem agressão."
  target_customer: "Pessoas que buscam limpeza eficaz sem ressecamento, especialmente com cabelos sensíveis, coloridos ou tratados."

