product_description:
  short: "Prevenção do desbotamento e vitalidade do fio, proteção solar e da poluição."
  detailed: |
    O Booster Antioxidante GE Beauty é um concentrado de ativos que combate os danos diários causados por raios UV, poluição e fatores ambientais. Especialmente formulado para prevenir o desbotamento da cor e preservar a vitalidade dos fios, este booster oferece proteção antioxidante avançada que mantém o cabelo saudável, vibrante e com cor duradoura. Ideal para cabelos coloridos, quimicamente tratados ou expostos a agressões ambientais, proporciona defesa completa contra o envelhecimento precoce dos fios.
  key_differentiators:
    - "Concentrado de ativos antioxidantes para máxima eficácia."
    - "Proteção específica contra desbotamento da cor."
    - "Defesa completa contra UV, poluição e fatores ambientais."
  positioning: "Para cabelos protegidos, vibrantes e com cor duradoura."
  target_customer: "Pessoas com cabelos coloridos ou expostos a fatores ambientais que buscam proteção antioxidante."

