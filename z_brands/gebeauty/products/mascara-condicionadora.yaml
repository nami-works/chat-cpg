product_description:
  short: "Hidratação intensa e fios sem frizz em todos os tipos de cabelo."
  detailed: |
    A Máscara Condicionadora GE Beauty é uma máscara leve e vegana que proporciona hidratação intensa e nutrição profunda para todos os tipos de cabelo. Sua fórmula avançada sela as cutículas, controla o frizz e recupera a maciez natural dos fios. Ideal para cabelos ressecados, danificados, coloridos ou quimicamente tratados, oferece tratamento intensivo que deixa os cabelos visivelmente mais saudáveis, macios e com brilho natural.
  key_differentiators:
    - "Fórmula vegana e leve que não pesa nos fios."
    - "Hidratação intensa que sela as cutículas."
    - "Adequada para todos os tipos de cabelo, inclusive coloridos e tratados."
  positioning: "Para cabelos intensamente hidratados, macios e livres de frizz."
  target_customer: "Pessoas que buscam hidratação profunda e controle de frizz para cabelos ressecados ou danificados."

