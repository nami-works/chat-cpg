product_description:
  short: "Cachos definidos e livres de frizz por 24h com proteção térmica."
  detailed: |
    "O Primer Cachos Definidos da GE Beauty é formulado com tecnologia vegetal à base de chia e linhaça, que forma um filme flexível ao redor dos fios, garantindo cachos definidos, macios e hidratados por até 24 horas. Protege do calor até 230°C, adiciona brilho e controla o frizz, mesmo em ambientes úmidos."
  key_differentiators:
    - "Tecnologia Wavemax® com chia e linhaça"
    - "Proteção térmica até 230°C"
    - "Efeito 'umbrella' contra umidade"
  positioning: "Para quem busca definição leve e natural dos cachos, com proteção e hidratação."
  target_customer: "Pessoas com cabelos cacheados ou ondulados que desejam definição e controle de frizz."

