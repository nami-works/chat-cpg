product_description:
  short: "Proteção térmica, fios sem frizz e com brilho natural."
  detailed: |
    O Leave-in com Proteção Térmica GE Beauty é uma fórmula leve que oferece proteção completa contra danos térmicos causados por secador, chapinha e babyliss. Nutre profundamente, sela as cutículas e controla o frizz, deixando os cabelos macios, soltos e com brilho natural. Ideal para uso diário, proporciona hidratação sem pesar nos fios, sendo perfeito para todos os tipos de cabelo, especialmente cabelos finos, cacheados, crespos e quimicamente tratados.
  key_differentiators:
    - "Fórmula leve que não pesa nos fios, ideal para cabelos finos."
    - "Proteção térmica eficaz contra ferramentas de calor."
    - "Controla frizz e proporciona brilho natural sem oleosidade."
  positioning: "Para cabelos protegidos, hidratados e livres de frizz no dia a dia."
  target_customer: "Pessoas que usam ferramentas de calor regularmente e buscam proteção térmica com hidratação leve."

benefits:
