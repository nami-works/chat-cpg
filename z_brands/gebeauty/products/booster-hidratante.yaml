product_description:
  short: "Hidratação intensa, maciez e brilho sem pesar."
  detailed: |
    O Booster Hidratante GE Beauty é um concentrado que restaura a saúde dos fios, melhora a penteabilidade e acalma o couro cabeludo. Especialmente formulado para potencializar hidratação, brilho e maciez, este booster oferece nutrição intensiva sem pesar nos fios. Ideal para cabelos secos, porosos, finos, quimicamente tratados ou que precisam de hidratação extra, proporciona maciez imediata e brilho natural duradouro.
  key_differentiators:
    - "Hidratação intensa sem pesar nos fios."
    - "Melhora a penteabilidade e acalma o couro cabeludo."
    - "Concentrado que potencializa qualquer tratamento hidratante."
  positioning: "Para cabelos intensamente hidratados, macios e brilhantes."
  target_customer: "Pessoas com cabelos secos, porosos, finos ou quimicamente tratados que precisam de hidratação intensiva."

