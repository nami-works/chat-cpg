product_description:
  short: "Volume, definição e textura natural por até 12 horas."
  detailed: |
    O Booster Definição GE Beauty é um concentrado que realça, prolonga e protege a finalização sem pesar nos fios. Especialmente formulado para potencializar a textura natural e proporcionar definição duradoura por até 12 horas, este booster oferece volume flexível, movimento e controle de frizz. Ideal para todos os tipos de cabelo, especialmente cabelos finos, lisos, ondulados, cacheados e crespos que precisam de mais definição e textura.
  key_differentiators:
    - "Definição e textura natural por até 12 horas."
    - "Volume flexível sem pesar nos fios."
    - "Realça e prolonga qualquer finalização."
  positioning: "Para cabelos com definição, volume e textura natural duradoura."
  target_customer: "Pessoas que buscam definição, volume e textura natural, especialmente cabelos finos ou sem movimento."

