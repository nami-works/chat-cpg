product_description:
  short: "Fluido multifuncional que hidrata, nutre, repara e protege sem pesar."
  detailed: |
    O Leave-in Pluma GE Beauty combina pantenol, arginina e óleo de girassol para fortalecer a fibra capilar, selar as cutículas e nutrir sem deixar resíduos. Oferece proteção térmica até 230°C, realinhamento temporário das fibras capilares e controle de frizz, mantendo os fios disciplinados mesmo em ambientes úmidos. # web: https://gebeauty.com.br/products/leave-in-pluma
  key_differentiators: 
    - "Proteção térmica até 230°C"
    - "Realinhamento temporário das fibras capilares"
    - "Controle de frizz em ambientes úmidos"
  positioning: "Para quem busca leveza, praticidade e liberdade no cuidado com o cabelo."
  target_customer: "Consumidores que desejam hidratação e proteção sem peso nos fios."

