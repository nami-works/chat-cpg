[project]
name = "copiloto"
version = "0.1.0"
description = "copiloto using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.130.0,<1.0.0"
]

[project.scripts]
copiloto = "copiloto.main:run"
run_crew = "copiloto.main:run"
train = "copiloto.main:train"
replay = "copiloto.main:replay"
test = "copiloto.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
