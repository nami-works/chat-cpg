[project]
name = "0_nami"
version = "0.1.0"
description = "0_nami using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.114.0,<1.0.0"
]

[project.scripts]
0_nami = "0_nami.main:run"
run_crew = "0_nami.main:run"
train = "0_nami.main:train"
replay = "0_nami.main:replay"
test = "0_nami.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
