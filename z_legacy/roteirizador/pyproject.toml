[project]
name = "roteirizador"
version = "0.1.0"
description = "roteirizador using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.114.0,<1.0.0"
]

[project.scripts]
roteirizador = "roteirizador.main:run"
run_crew = "roteirizador.main:run"
train = "roteirizador.main:train"
replay = "roteirizador.main:replay"
test = "roteirizador.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
