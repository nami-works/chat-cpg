#tasks [kigen]
analisar_problema:
  description: >
    Examinar detalhadamente o {problema} apresentado, entender o objetivo esperado,
    decompor o escopo em etapas modulares e identificar possíveis dependências lógicas
    entre as partes. Basear a análise primeiramente nos princípios descritos em
    {python_docs}, {python_patterns}, {awesome_python} e complementar com
    {crewai_conceitos} e {crewai_crews} quando necessário.
  expected_output: >
    Documento em markdown contendo:
    - Objetivo principal descrito de forma clara;
    - Fluxo sugerido em etapas lógicas (sequenciais ou paralelas);
    - Identificação de dependências entre etapas;
    - Avaliação preliminar da complexidade e possíveis abordagens.
  agent: avaliador_problemas

buscar_referencias:
  description: >
    Investigar se já existem bibliotecas, frameworks ou snippets que resolvem
    o {problema} proposto. Priorizar a busca em {bibliotecas}, {awesome_python},
    {docling_docs}, {langchain_docs}, {streamlit_docs}, {github} e {stack_overflow}.
    Utilizar {crewai_conceitos} e {crewai_crews} apenas quando não houver soluções
    diretas ou mais simplificadas nas bibliotecas existentes.
  expected_output: >
    Documento em markdown contendo:
    - Lista de bibliotecas e ferramentas encontradas;
    - Descrição resumida da funcionalidade de cada uma;
    - Exemplos de uso relevantes;
    - Avaliação de cobertura (total/parcial) em relação ao problema.
  agent: pesquisador_solucoes

avaliar_abordagem:
  description: >
    Avaliar, com base na estrutura modular do {problema} e nas soluções encontradas,
    se a melhor abordagem é a implementação de funções Python baseadas em bibliotecas
    existentes ou a construção de uma crew multiagente usando CrewAI.
    Priorizar o uso de {python_docs}, {awesome_python}, {docling_docs}, {langchain_docs},
    {streamlit_docs}, {github} e {stack_overflow}. Utilizar {crewai_conceitos} e {crewai_crews}
    apenas se necessário para justificar a escolha por crew.
  expected_output: >
    Documento em markdown contendo:
    - Decisão tomada: criar funções ou criar crew;
    - Justificativa técnica baseada em evidências;
    - Comparação dos prós e contras de cada abordagem;
    - Sugestão clara de próximos passos conforme a decisão.
    A primeira linha do documento deve seguir sempre:
    a) quando a decisão for criar funções, escrever no início: "# Decisão Tomada: criar_funcoes"
    b) quando a decisão for criar crew, escrever no início: "# Decisão Tomada: criar_crew"
  agent: decisor_estrategico

identificar_inputs:
  description: >
    Analisar os objetivos e etapas da solução recomendada para identificar todas as informações externas
    necessárias para seu funcionamento correto e eficiente. Classificar os inputs como:
    - internos (produzidos por outras funções ou tasks),
    - externos acessíveis na internet (ex: documentações, repositórios),
    - externos fornecidos pelo usuário (ex: arquivos .csv, arquivos .md, links, listas, etc.).
    Para cada input externo necessário, indicar onde obtê-lo ou que tipo de input
    deve ser solicitado ao usuário. Basear-se em {github}, {stack_overflow} e {bibliotecas}.
    para ampliar o repertório de formatos e padrões comumente utilizados.
  expected_output: >
    Documento markdown com tabela contendo nome do input, tipo (string, arquivo, URL),
    origem (interno, externo web, externo usuário), e instruções para coleta e uso.
    ```md
    | Input                  | Tipo     | Origem         | Instrução de Coleta                             |
    |------------------------|----------|----------------|-------------------------------------------------|
    | estilo                 | arquivo  | externo usuário| Solicitar .md com guia de tom e voz da marca   |
    | produtos               | arquivo  | externo usuário| Solicitar .md com portfólio de produtos         |
    | marca                  | string   | externo usuário| Informar o domínio do site da marca             |
    | guia_ferramentas       | url      | externo web    | Acessar https://docs.crewai.com/how-to/create-custom-tools |
    | conceito de agents     | url      | externo web    | https://docs.crewai.com/concepts/agents        |
    ```
  agent: especialista_inputs

validar_inputs:
  description: >
    Conferir se todos os inputs identificados na etapa anterior como necessários para resolver o {problema} 
    foram providos. Em caso de ausência, notificar o usuário ou marcar como pendência para
    coleta futura. Validar os formatos e a completude com base em práticas disponíveis em {bibliotecas},
    {github} e {stack_overflow}.
  expected_output: >
    Checklist validado de inputs obrigatórios com status (presente / ausente),
    anotações sobre formato, consistência e recomendações de ajustes quando necessário.
  agent: validador_inputs

gerar_modelos:
  description: >
    Com base na estrutura de inputs validada, gerar um arquivo modelo que oriente o usuário sobre os dados necessários.
    O modelo pode ser gerado como CSV de exemplo, JSON estruturado ou Markdown descritivo, conforme o tipo de input.
    O conteúdo deve incluir:
    - nomes de campos esperados;
    - tipos de dados previstos (texto, número, data, etc);
    - valores ilustrativos;
    - observações úteis sobre cada campo.
  expected_output: >
    Arquivo contendo modelo de dados de entrada no formato apropriado, pronto para edição e reutilização.
    O arquivo deve conter exemplos válidos e informações suficientes para que o usuário entenda exatamente o que fornecer.
    Nome sugerido: exemplo_input.csv ou input_explicado.md, salvo na pasta de projeto correspondente.
  agent: gerador_modelos

#tasks [codigo]
mapear_funcoes:
  description: >
    Ler o conteúdo de {solucao} e das etapas anteriores para identificar todas as funcionalidades que
    precisam ser transformadas em funções Python. A partir disso, decompor essas funcionalidades em funções
    específicas, cada uma com um único propósito claro.
    Para cada função, descrever:
    - Nome técnico da função em 'snake_case' (claro e em português);
    - Lista de parâmetros de entrada, com tipo esperado e origem (ex: input do usuário, variável de ambiente, arquivo);
    - Tipo e formato da saída esperada (ex: string transcrita, arquivo temporário, JSON);
    - Breve descrição funcional, explicando o que a função faz e como se encaixa no fluxo total da {solucao}.
    Sempre indicar se a função depende de bibliotecas externas (ex: Whisper, Streamlit, dotenv, etc.), se o input vem
    do navegador ou ambiente local, e se há restrições (ex: HTTPS, autenticação, permissão do navegador).
    O foco deve ser modularidade, reutilização e clareza.
  expected_output: >
    Documento em markdown com uma tabela contendo:
    - Nome da função
    - Parâmetros (nome + tipo)
    - Saída (tipo + formato)
    - Descrição funcional (clara e objetiva)
    Ao final, incluir observações adicionais:
    - Dependências externas por função
    - Restrições de ambiente (ex: uso de 'st_audiorec' depende de HTTPS)
    - Inputs que devem ser definidos antes (ex: chave de API)
    Exemplo de linha:
    | Nome da Função       | Parâmetros                        | Saída esperada        | Descrição |
    |----------------------|------------------------------------|------------------------|-----------|
    | transcrever_audio    | audio: bytes                      | texto: str             | Transcreve áudio WAV usando Whisper API |
  agent: avaliador_problemas

buscar_padroes_funcoes:
  description: >
    Ler toda a documentação disponível em {python_docs}, {awesome_python}, {python_patterns}, {docling_docs}, {langchain_docs} e {streamlit_docs},
    para entender as bibliotecas já desenvolvidas disponíveis que podem atuar na resolução do problema.
    A partir da lista de funções planejadas na task 'mapear_funcoes`, e a da sua consulta à documentação, 
    buscar padrões prontos, exemplos funcionais, snippets de uso e melhores práticas já consolidadas no ecossistema Python.
    Deve consultar ainda:
    - {github}: projetos similares ou bibliotecas que já resolvem parte da lógica
    - {stack_overflow}: dúvidas frequentes e soluções aceitas
    - {bibliotecas}, {python_docs}, {awesome_python}: funções bem documentadas
    - {streamlit_docs}: uso correto de componentes como 'st_audiorec`, 'webrtc`, 'st.secrets`, etc.
    Para cada função, retornar:
    - Links diretos para os trechos de código de referência
    - Código simplificado e adaptado, quando aplicável
    - Comentário técnico explicando se a referência cobre total ou parcialmente a função esperada
    - Alternativas viáveis, se houver mais de uma abordagem válida
    Deve também sinalizar se:
    - A função depende de ambiente online, permissões de navegador ou bibliotecas instáveis
    - O exemplo encontrado é compatível com a versão atual das
  expected_output: >
    Análise minuciosa de cada função disponível, contendo:
    - Nome da função (como planejado)
    - Lista de links e trechos de código de referência
    - Avaliação da cobertura (total/parcial)
    - Observações sobre compatibilidade, limitações e dependências
    - Sugestões de bibliotecas preferenciais
    Exemplo de bloco:
    ### transcrever_audio
    - [x] Referência 1: https://github.com/openai/whisper/blob/main/whisper/transcribe.py
      - Cobre o uso do modelo Whisper local
    - [x] Referência 2: https://platform.openai.com/docs/guides/speech-to-text
      - Uso da API Whisper (100% compatível com OpenAI >=1.0.0)
    - Comentário: Recomendado usar a API por simplicidade e atualização automática. A referência 1 exige GPU ou torch local.
  agent: pesquisador_solucoes

revisar_padroes_funcoes:
  description: >
    Revisar criticamente os padrões de função coletados na task `buscar_padroes_funcoes`, verificando:
    - Se os links fornecidos ainda estão ativos e válidos;
    - Se o exemplo de código é funcional e atualizado;
    - Se a biblioteca referenciada é estável, mantida e amplamente compatível;
    - Se a escolha apresentada é realmente a mais simples, eficiente e alinhada com a lógica da função.
    Para cada função, aplicar uma revisão técnica comparativa:
    - Consolidar uma única recomendação final (biblioteca + referência de código);
    - Justificar tecnicamente a escolha da abordagem, indicando trade-offs entre alternativas;
    - Substituir referências ruins ou frágeis por outras mais robustas;
    - Marcar claramente funções que ainda carecem de padrão claro e solicitar reforço na busca.
    A task deve usar como fontes todas as indicadas em {python_docs}, {awesome_python}, {python_patterns}, {docling_docs}, {langchain_docs}, {streamlit_docs}, {github}, {stack_overflow} e {bibliotecas}.
  expected_output: >
    Recomendação minuciosa de cada função disponível, contendo:
    - Para cada função:
      - Resumo das referências recebidas
      - Análise crítica e técnica
      - Recomendação final com link
      - Justificativa técnica da escolha
      - Comentários sobre riscos, limitações ou ajustes necessários
  agent: pesquisador_solucoes

escrever_codigo:
  description: >
    Estudar a recomendação gerada pela tarefa revisar_padroes_funcoes, e a partir dela gerar o arquivo em formato '.py'
    implementando as funções planejadas e baseadas nas referências coletadas. Utilizar padrões de codificação Python extraídos de
    {python_docs}, {python_patterns}, {awesome_python} e práticas observadas em {github} e {stack_overflow}.
    O código gerado deve:
    - Ser funcional, modular e limpo;
    - Estar pronto para execução em ambiente local ou nuvem (ex: Streamlit Cloud, executor externo);
    - Contar com tratamento de erros robusto, permitindo diagnóstico confiável e retroalimentação automatizada.
    Para isso, cada função deve conter:
    - Nome claro em 'snake_case`;
    - Tipagem explícita dos parâmetros e do retorno;
    - Docstring completa em formato PEP 257, com:
      - Descrição funcional clara;
      - Parâmetros de entrada com tipo e propósito;
      - Retorno esperado;
      - Exemplo de uso real com entrada e saída ilustrativas;
    Ao final do código, incluir obrigatoriamente uma função 'main()' que orquestre o fluxo da aplicação,
    com **blocos 'try/except' em torno de cada etapa relevante** (captura de entrada, processamento, exibição).
    Isso garante:
    - Que falhas parciais sejam capturadas sem interromper a execução;
    - Que mensagens de erro claras sejam exibidas;
    - Que logs possam ser coletados por sistemas externos de diagnóstico (ex: 'executar_solucao.py`).
    Exemplo recomendado de estrutura para 'main()`:

    def main():
        try:
            audio = gravar_audio()
        except Exception as e:
            print(f"❌ Erro ao gravar áudio: [e]")
            audio = None

        try:
            if audio:
                texto = transcrever_audio(audio)
            else:
                texto = None
        except Exception as e:
            print(f"❌ Erro na transcrição: [e]")
            texto = None

        try:
            if texto:
                exibir_transcricao(texto)
        except Exception as e:
            print(f"❌ Erro ao exibir a transcrição: [e]")

    E ao final do arquivo, sempre incluir:

    if __name__ == "__main__":
        main()

    Isso garante compatibilidade com execução via terminal, agendadores, webhooks e fluxos CI/CD.
    O código deve ser tolerante a falhas previsíveis, como ausência de internet, entrada inválida ou API com erro.
  expected_output: >
    Arquivo 'codigo_v1.py' contendo:
    - Todas as funções mapeadas e implementadas;
    - Imports organizados e seguros;
    - Docstrings completas com exemplos reais;
    - Estrutura modular com funções isoladas;
    - Função 'main()' com blocos 'try/except' por etapa funcional;
    - Linha 'if __name__ == "__main__"' ao final para execução explícita;
    - Compatibilidade com execução automatizada e logging de falhas;
    - Proteção contra erros comuns como API inválida, input ausente ou formatação incorreta.
    A execução não deve falhar silenciosamente.
    Todas as falhas devem ser informadas com mensagens iniciadas por:
    ❌ Erro em <etapa>: <mensagem>
    Todo comentário de fechamento ou explicação adicional deve vir comentado com um '#'' no formato:
    # Este código foi gerado com base na solução proposta. Ele está preparado para ser executado em nuvem.
  agent: engenheiro_solucoes

validar_imports:
  description: >
    Entender a {solucao} definida, e também todas as funções e bibliotecas criadas (tudo que constar import ou def) no código gerado na etapa anterior.
    Avaliar se as funções e bibliotecas inseridas realmente existem e se as funções criadas funcionam, e se serão efetivas na resolução do problema.
    Para isso, ler toda a documentação disponível em {python_docs}, {awesome_python}, {python_patterns}, {docling_docs}, {langchain_docs} e {streamlit_docs},
    além das fontes abaixo:
    - {github}: projetos similares ou bibliotecas que já resolvem parte da lógica
    - {stack_overflow}: dúvidas frequentes e soluções aceitas
    - {bibliotecas}, {python_docs}, {awesome_python}: funções bem documentadas
    - {streamlit_docs}: uso correto de componentes como 'st_audiorec`, 'webrtc`, 'st.secrets`, etc.
  expected_output: >
    Arquivo imports_invalidos.md, que deve apontar para imports e funções inexistentes ou com problemas, e que consequentemente não funcionarão e trarão problemas ao código.
  agent: engenheiro_solucoes

corrigir_imports:
  description: >
    Consultar o {problema} que está sendo resolvido, a {solucao} proposta e ler toda a documentação disponível
    em {python_docs}, {awesome_python}, {python_patterns}, {docling_docs}, {langchain_docs} e {streamlit_docs},
    para entender as bibliotecas já desenvolvidas disponíveis que podem atuar na resolução do problema.
    Avaliar o código 'codigo_v1.py' gerado na task escrever_codigo para resolver o problema e entender sua estrutura.
    Entender as funções e bibliotecas sendo importadas no código, como elas devem resolver o problema.
    Corrigir os imports inválidos identificados pela task anterior, com base no conteúdo de 'imports_invalidos.md'.
    (um dicionário Python que mapeia módulos e símbolos não encontrados no código).
    Para cada entrada do dicionário:
    - Buscar o módulo correto consultando {python_docs}, {awesome_python}, {python_patterns}, {docling_docs}, {langchain_docs} e {streamlit_docs};
    - Substituir o import incorreto no código gerado em escrever_codigo;
    - Preservar a lógica do código original;
    - Corrigir múltiplos símbolos de um mesmo módulo, se aplicável;
    - Ignorar símbolos que já forem corrigidos em etapas anteriores.
    Ao final, retornar:
    - Arquivo 'codigo_v2.py' com
      - código atualizado com todos os imports corrigidos;
  expected_output: >
    Dois arquivos:
    - 'codigo_v2.py' com os imports corrigidos;
    - 'log_alteracoes.md' com as alterações realizadas
  agent: engenheiro_solucoes
  
  # description: >
    # - Arquivo 'log_alteracoes.md', contendo, para cada linha alterada:
    #   - Linha original removida (comentada)
    #   - Linha nova inserida
    #   - Justificativa para a substituição
    #   - Fonte consultada (link)
  # expected_output: >
  #   - 'log_alteracoes.md' com as alterações realizadas

identificar_dependencias:
  description: >
    Analisar o conteúdo de {solucao}, as funções implementadas e os padrões identificados
    para determinar todas as dependências externas necessárias à execução da solução.
    A análise deve verificar:
    - Bibliotecas Python instaláveis via pip (ex: openai, streamlit, python-dotenv, torch)
    - Bibliotecas que precisam ser instaladas via 'git+https://...' (ex: openai/whisper)
    - Dependências do sistema operacional (ex: ffmpeg, git)
    - Se a biblioteca exige permissões específicas (ex: acesso ao microfone via navegador)
    - Possíveis conflitos ou versões incompatíveis conhecidas
    A tarefa deve também:
    - Validar se há bibliotecas obsoletas ou com forks conflitantes
    - Priorizar versões estáveis e amplamente compatíveis
    - Sugerir versões mínimas necessárias com base nos exemplos e funções usadas
    Todas as dependências devem ser organizadas em um arquivo 'requirements.txt`
    pronto para ser usado com: 'pip install -r requirements.txt`.
  expected_output: >
    Arquivo 'requirements.txt' contendo:
    - Uma linha por biblioteca externa
    - Nome do pacote e versão no formato 'pip freeze`
    - Para pacotes Git, usar o prefixo 'git+https://...`
    - Nenhum comentário, duplicata ou biblioteca desnecessária
    - Apenas bibliotecas essenciais para a execução da solução (não incluir libs de teste, salvo se obrigatórias)
    Exemplo de conteúdo esperado:
    streamlit==1.32.0
    streamlit-audiorec
    python-dotenv
    openai
    torch==2.1.0
    git+https://github.com/openai/whisper.git
    Caso haja dependência de sistema (não via pip), incluir em um bloco separado ao final do arquivo:
    # Dependências externas do sistema:
    # - ffmpeg (necessário para whisper local)
    # - git (necessário para instalação via git+https)
  agent: pesquisador_solucoes

mapear_dependencias_extras:
  description: >
    Ler o arquivo 'requirements.txt' gerado na task 'identificar_dependencias' e enriquecer automaticamente
    as dependências com extras conhecidos, conforme boas práticas de instalação.
    Para cada pacote identificado como necessitando de extras, incluir na linha de requirements
    no formato 'pacote[extra]'.
    Além disso, gerar um relatório explicando cada extra adicionado, com:
    - Nome do pacote original
    - Nome do extra adicionado
    - Justificativa técnica ou referência
    Por exemplo:
    - `unstructured` ➡ `unstructured[all-docs]`: Necessário para habilitar parsers adicionais como PDF, Word, etc.
    - `transformers` ➡ `transformers[sentencepiece]`: Necessário para tokenização de modelos específicos.
  expected_output: >
    `requirements.txt` atualizado, com lista final de dependências enriquecidas com extras.
  agent: mapeador_dependencias

#tasks [depuracao]
reescrever_codigo:
  description: >
    Compreendendo o {problema} e a {solucao} proposta para resolve-lo, e a partir da revisão do
    {codigo} gerado anteriormente, reigstrada no {log_execucao}, criado pelo script 'executar_solucao.py' —
    revisar o  e aplicar as correções necessárias de forma precisa e incremental.
    Para cada erro identificado no log, a task deve:
    - Localizar a função correspondente no código original;
    - Entender o tipo de falha (ex: import inexistente, função obsoleta, ausência de tratamento de exceção,
      incompatibilidade com versões atuais de bibliotecas, uso de pacotes não compatíveis com navegador ou nuvem);
    - Corrigir apenas o trecho necessário, mantendo o restante do código intacto;
    - Atualizar o 'main()' se necessário para inserir 'try/except' em etapas ainda desprotegidas;
    - Padronizar todas as mensagens de erro no seguinte formato:
      ❌ Erro na função <nome>: <mensagem clara>
    A task deve considerar boas práticas extraídas de {python_docs}, {github}, {stack_overflow} e da experiência
    prática documentada nas execuções anteriores. Também pode:
    - Ajustar chamadas à API para a versão mais recente (ex: OpenAI >= 1.0.0);
    - Substituir bibliotecas ineficazes ou incompatíveis (ex: 'pyperclip' ➜ 'st.code`);
    - Incluir mocks para entradas críticas (ex: entrada de áudio);
    - Reforçar tipagem e docstrings com base nas alterações aplicadas.
    Essa task complementa o ciclo de execução automática, garantindo que o Kigen aprenda com seus erros e
    refine suas entregas progressivamente.
  expected_output: >
    Versão atualizada do arquivo 'codigo_v3.py`, contendo:
    - As mesmas funções do '_main.py', mas com correções aplicadas;
    - Docstrings e tipagens atualizadas nas funções modificadas;
    - Mensagens de erro ajustadas no padrão visual da solução;
    - Imports corrigidos, se necessário;
    - Estrutura 'main()' preservada ou reforçada com 'try/except`;
    - Código pronto para nova execução por 'executar_solucao.py`.
  agent: engenheiro_solucoes

  # expected_output: >
  #   Também deve ser gerado um arquivo 'log_correcao.md' com:
  #   - Nome de cada função modificada;
  #   - Motivo da alteração (com base no trecho do 'log_execucao.md`);
  #   - Trecho original removido (se aplicável);
  #   - Novo trecho inserido;
  #   - Comentário explicando a decisão técnica tomada.
  #   Exemplo de entrada no 'log_correcao.md`:
  #   ---
  #   ✅ Função: 'transcrever_audio`
  #   💥 Erro original: AttributeError: module 'openai' has no attribute 'Audio'
  #   🛠️ Correção: substituído por 'client.audio.transcriptions.create(...)`
  #   📎 Fonte: documentação oficial da OpenAI (versão >= 1.0.0)
  #   ---

auditar_melhoria_iterativa:
  description: >
    Analisar arquivos históricos de execução e correção — como 'log_execucao.md' e 'log_correcao.md' —
    de múltiplas rodadas anteriores, com o objetivo de identificar padrões de falha, oportunidades de
    melhoria técnica e sugestões para evitar erros recorrentes nas próximas gerações de código.
    A auditoria deve processar:
    - Múltiplos pares de logs (`log_execucao.md' + 'log_correcao.md`);
    - Agrupar erros semelhantes (ex: chamadas depreciadas, uso inadequado de bibliotecas);
    - Identificar funções que falham com frequência (ex: transcrição de áudio, uso de API, entradas do navegador);
    - Sugerir diretrizes para futuras crews e agents (ex: não usar 'pyperclip`, validar versão do 'openai`, sempre proteger 'main()' com 'try/except`).
    Deve também propor melhorias nas tasks e agentes, como:
    - Campos adicionais de validação em 'validador_inputs`;
    - Reforço de recomendações em 'escrever_codigo`;
    - Novas mensagens padrão de erro;
    - Inclusão de testes automatizados para funções com maior taxa de falha.
  expected_output: >
    Arquivo 'relatorio_auditoria.md' contendo:
    - Lista de erros mais frequentes por função
    - Bibliotecas ou comandos que causam mais falhas
    - Funções que exigem tratamento reforçado
    - Sugestões de mudanças em tasks e agentes
    - Gatilhos que devem ser usados em crews futuras para evitar as falhas anteriores
    - Sugestões para criação de novos testes ou templates de entrada
    - Tabela com resumo estatístico por tipo de erro
    Exemplo de bloco:
    ---
    📊 Função: transcrever_audio
    - Ocorrências: 3
    - Erro mais comum: uso de API depreciada do openai
    - Correção aplicada: substituição por client.audio.transcriptions.create
    - Sugestão: reforçar instrução sobre openai>=1.0.0 na task escrever_codigo
    ---
  agent: avaliador_problemas

validar_ambiente_execucao:
  description: >
    Verificar se o ambiente onde a solução será executada possui os elementos mínimos
    necessários para rodar o código com segurança e previsibilidade.
    A task deve, com base no código da {solucao} e no 'requirements.txt' gerado:
    - Validar a presença de bibliotecas críticas instaladas (ex: openai, torch, streamlit, streamlit-webrtc);
    - Confirmar se as versões instaladas são compatíveis com os exemplos de código gerados (ex: openai >= 1.0.0);
    - Verificar a existência de ferramentas externas exigidas (ex: ffmpeg, git, sox), usando comandos de verificação do sistema;
    - Verificar se há variáveis de ambiente obrigatórias (`.env`) ou 'secrets.toml' para execução correta (ex: OPENAI_API_KEY);
    - Detectar a presença de restrições típicas de ambientes de nuvem (ex: acesso ao microfone, clipboard, GPU);
    A task pode ainda propor:
    - Comandos de instalação ausentes;
    - Alternativas compatíveis caso o ambiente não atenda aos requisitos mínimos (ex: trocar biblioteca, usar API em vez de modelo local);
    - Orientações para adaptar o código à nuvem ou a execuções offline.
  expected_output: >
    Arquivo 'status_ambiente.md' contendo:
    - Lista de itens validados (bibliotecas, binários, variáveis)
    - Status de cada item (Presente / Ausente / Incompatível)
    - Mensagens claras de como resolver cada ausência
    - Sugestões para adaptar o código, se necessário
    Exemplo de bloco:
    ---
    ✅ streamlit==1.32.0 → OK
    ✅ python-dotenv → OK
    ❌ streamlit-webrtc → NÃO ENCONTRADO
    💡 Instalar com: pip install streamlit-webrtc==0.46.3
    ❌ ffmpeg → NÃO ENCONTRADO
    💡 Recomendado para uso local do whisper. Instalar com: brew install ffmpeg ou choco install ffmpeg
    ❌ OPENAI_API_KEY → NÃO DEFINIDA
    💡 Adicione ao .env: OPENAI_API_KEY=seu_token_aqui
    ---
  agent: validador_inputs

corrigir_requirements:
  description: >
    Ler o conteúdo de 'ambiente_status.md' e gerar um novo 'requirements.txt`
    completo e funcional, com:
    - Todas as bibliotecas obrigatórias;
    - Versões compatíveis com o código da {solucao};
    - Inclusão de libs Git quando necessário (ex: whisper);
    - Exclusão de bibliotecas duplicadas, obsoletas ou desnecessárias.
  expected_output: >
    Novo arquivo 'requirements.txt`, e log de alterações como 'log_ajustes_ambiente.md`.
  agent: engenheiro_solucoes

gerar_env_minimo:
  description: >
    A partir do conteúdo de 'ambiente_status.md`, gerar um arquivo 'env.txt`
    contendo todas as variáveis de ambiente necessárias para que a {solucao} funcione corretamente.
    Este arquivo serve como **modelo seguro de configuração**, e deve:
    - Conter apenas variáveis realmente exigidas para a execução;
    - Utilizar valores genéricos ou placeholders (nunca valores reais);
    - Incluir comentários explicativos para cada variável;
    - Seguir o mesmo formato de um '.env' compatível com 'python-dotenv`;
    - Ser salvo como 'env.txt' para evitar sobrescrita acidental de '.env' já existente.
    Ao final, incluir instrução clara para o usuário:
    ➜ “Copie manualmente o conteúdo de 'env.txt' para seu arquivo '.env' após revisar.”
  expected_output: >
    Arquivo 'env.txt`, contendo:
    - Todas as variáveis obrigatórias da solução;
    - Comentários explicativos em português para cada linha;
    - Nenhuma chave, senha ou token real preenchido;
    - Pronto para ser copiado manualmente para '.env`.
    Exemplo:
    # === Ambiente sugerido pela Crew ===
    # ATENÇÃO: Copie manualmente para .env após revisar.
    # 🔐 Chave de acesso à OpenAI (obrigatória)
    OPENAI_API_KEY=coloque_sua_chave_aqui

    # ⚙️ Modo debug (opcional: true ou false)
    DEBUG_MODE=true
  agent: especialista_inputs


